name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint + frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  python-tests:
    name: Python backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server_py/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: server_py
      - run: python -m pytest -q
        working-directory: server_py

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Node backend image
        run: docker build -t tradehub-node:ci .
      - name: Build Python backend image
        run: docker build -t tradehub-api-py:ci server_py
      - name: Smoke-test Node backend
        run: |
          docker run -d --name api-node -p 3001:3001 \
            -e JWT_SECRET=ci-smoke-secret \
            -e REFRESH_SECRET=ci-smoke-secret \
            -e ADMIN_PASSWORD=ci-smoke-secret \
            tradehub-node:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health; then ok=1; break; fi
            sleep 2
          done
          docker logs api-node || true
          docker rm -f api-node || true
          test -n "$ok"
      - name: Smoke-test Python backend
        run: |
          docker run -d --name api-py -p 3001:3001 tradehub-api-py:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health; then ok=1; break; fi
            sleep 2
          done
          docker logs api-py || true
          docker rm -f api-py || true
          test -n "$ok"
