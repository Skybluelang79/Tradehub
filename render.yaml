services:
  - type: web
    name: tradehub-api
    env: node
    region: oregon
    # Must be a paid plan (starter or above). Render does not attach persistent
    # disks to free instances, and without the disk below the database and every
    # uploaded image are wiped on each deploy.
    plan: starter
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        value:
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: APP_URL
        fromService:
          type: web
          name: tradehub-frontend
          property: url
      - key: FRONTEND_URL
        fromService:
          type: web
          name: tradehub-frontend
          property: url
      # Both must sit on the disk. Unset, they resolve inside the ephemeral
      # checkout and the database and every uploaded image are lost on redeploy.
      - key: DB_PATH
        value: /var/data/tradehub.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
    # Mounted outside the repo. Mounting over the server directory would shadow
    # index.js and the routes with an empty volume, and the service would not
    # boot. Persistent disks require a paid plan, so this cannot run on `free`.
    disk:
      name: tradehub-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: tradehub-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # The app is built with VITE_BASE=/ and its routes sit at the root, so
      # deep links such as /terms must fall through to the SPA shell.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tradehub-api
          property: url
