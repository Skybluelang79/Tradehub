services:
  - type: web
    name: tradehub
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/tradehub.db
      - key: UPLOADS_DIR
        value: /opt/render/project/src/uploads
      - key: OPENAI_API_KEY
        value:
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
