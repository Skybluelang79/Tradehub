services:
  - type: web
    name: tradehub-api-py
    runtime: docker
    region: oregon
    plan: starter
    dockerContext: ./server_py
    dockerfilePath: ./server_py/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_PATH
        value: /data/tradehub.db
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: RUN_SCHEDULER
        value: "true"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: TradeHub
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
    disk:
      name: tradehub-data
      mountPath: /data
      sizeGB: 1
